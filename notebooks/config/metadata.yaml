# What the model reads off each filing's cover page at ingest time.
#
# These values become exact-match search filters, so the same document must
# always produce the same values. Only the cover page is needed, so char_limit
# stays small: less text, fewer distractions, better extraction.

prompt: |
  You are reading the cover page of an SEC filing. Extract the three fields
  below. Copy values from the page, never from your own knowledge of the
  company. If a value is not printed on the page, return null for it. Never
  guess.

  1. company_name: the registrant's legal name, printed directly above the
     line starting with "Exact name of registrant". Rules:
     - lowercase the whole name, keep the punctuation exactly as printed
     - keep legal suffixes such as "inc.", add or drop nothing
     - never return a ticker symbol, a brand name, or a shortened form
     Example: amazon.com, inc.
  2. doc_type: the form type printed near the top. Return exactly one of
     these lowercase values and nothing else: 10-k, 10-q, 8-k.
  3. fiscal_year: the 4 digit year from the line starting with "For the
     fiscal year ended". Return it as an integer, for example: 2024. Never
     use the filing date, a copyright year, or any other date on the page.

char_limit: 3000

fields:
  - name: company_name
    description: The registrant's legal name in lowercase
    type: string
  - name: doc_type
    description: The SEC form type
    type: string
    values: ["10-k", "10-q", "8-k"]
  - name: fiscal_year
    description: The fiscal year the filing covers, a 4 digit integer
    type: integer
